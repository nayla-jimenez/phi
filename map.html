<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>PHI Facility Map</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

body{
margin:0;
font-family:'Poppins', sans-serif;
}

#container{
display:flex;
height:650px;
}

#map{
width:75%;
height:650px;
}

#panel{
width:25%;
padding:25px;
background:white;
overflow:auto;
box-sizing:border-box;
}

h2,h3{
font-family:'Poppins', sans-serif;
font-weight:800;
color:#006d77;
}

p{
font-family:'Poppins', sans-serif;
font-size:16px;
line-height:1.5;
}

@media(max-width:800px){

#container{
flex-direction:column;
height:auto;
}

#map{
width:100%;
height:400px;
}

#panel{
width:100%;
}

}

</style>

</head>

<body>

<div id="container">

<div id="map"></div>

<div id="panel">

<h2>Adopt a Facility</h2>

<p>
Explore PHI's partner hospitals, schools, and community organizations across the Philippines. Click a marker to learn more about each facility and the communities they serve.
</p>

</div>

</div>

<script>

// ===================================
// FACILITY DATABASE
// ===================================

var facilities=[

{

name:"Eversley Childs Sanitarium and General Hospital",

city:"Cebu City, Philippines",

lat:10.366,

lng:123.953,

about:
"Eversley Childs Sanitarium and General Hospital is a Department of Health (DOH)-retained government hospital located in Jagobiao, Mandaue City, Cebu. Originally established in 1930 as a treatment center for Hansen's disease (leprosy), it has since expanded into a secondary general hospital providing comprehensive medical, surgical, pediatric, obstetric, and specialty healthcare services while continuing its historic role as a referral center for Hansen's disease. Today, the hospital serves patients throughout Central Visayas with an authorized capacity of 500 beds and remains committed to delivering accessible, high-quality public healthcare through clinical services, training, and community outreach programs."

},

{

name:"Vicente Sotto Memorial Medical Center",

city:"Cebu City, Philippines",

lat:10.308,

lng:123.891,

about:
"Vicente Sotto Memorial Medical Center (VSMMC) is a government-owned tertiary medical center in Cebu City under the Department of Health (DOH), serving as a major referral hospital and teaching/training institution in Central Visayas. It provides comprehensive healthcare services across multiple specialties, including pediatric care, emergency and trauma services, cardiovascular care, renal care, cancer care, and other advanced medical programs.  With a capacity of approximately 1,500 beds, VSMMC plays a critical role in providing accessible public healthcare, medical education, and specialized treatment for patients throughout the region."

},

{

name:"Alimodian National Comprehensive High School",

city:"Iloilo, Philippines",

lat:10.826,

lng:122.430,

about:
"Alimodian National Comprehensive High School (ANCHS) is a public secondary school located in Alimodian, Iloilo, Philippines, serving students from the municipality and surrounding communities. Established as a national comprehensive high school in 1969 after being converted from the Alimodian National Vocational High School, it provides a broad secondary education that includes both academic and technical-vocational programs. Over the years, ANCHS has become one of the municipality's leading educational institutions, preparing students for higher education, employment, and community leadership while supporting local development initiatives."

},

{

name:"Malaya Elementary School",

city:"Malaya, Philippines",

lat:14.399,

lng:121.339,

about:
"Malaya Elementary School is a public elementary school located in Barangay Malaya, Pililla, Rizal, Philippines, serving young learners in the local community under the Department of Education (DepEd) system.  The school provides foundational education for elementary students and has been supported through community efforts, including rehabilitation and improvement of school facilities following past damage from natural disasters. As a community-based public school, Malaya Elementary School plays an important role in expanding access to quality primary education for children in Pililla and surrounding areas."
},

{

name:"University of Santo Tomas Medical Alumni Association",

city:"Manila, Philippines",

lat:14.620,

lng:120.988,

about:
"The University of Santo Tomas Medical Alumni Association (USTMAA) is an organization composed of graduates and faculty members of the University of Santo Tomas Faculty of Medicine and Surgery dedicated to promoting Thomasian values of service, excellence, and ethical healthcare.  Established in 1940, USTMAA fosters lifelong connections among medical alumni while supporting professional development, medical education, scholarships, and community health initiatives.  Through programs such as outreach initiatives and healthcare support efforts, the association continues the legacy of compassionate service and leadership among physicians in the Philippines and beyond."
},

{

name:"Crossway Kidney Care",

city:"Iloilo, Philippines",

lat:10.720,

lng:122.562,

about:
"Crossway Kidney Care is a private dialysis center located in Iloilo City. It provides hemodialysis and internal medicine services for patients with chronic kidney disease, offering accessible renal care in a modern outpatient setting. The center is accredited by PhilHealth as MDSS Crossway Kidney Care Inc. and supports patients through regular dialysis treatments while working with nephrologists to provide comprehensive kidney care."

}



];


// ===================================
// CREATE MAP
// ===================================

var map=L.map("map")
.setView(
[12.8797,121.7740],
6
);

L.tileLayer(

"https://tile.openstreetmap.org/{z}/{x}/{y}.png",

{
attribution:"© OpenStreetMap contributors"
}

).addTo(map);


// ===================================
// CREATE MARKERS
// ===================================

facilities.forEach(function(f){

var marker=L.marker(
[
f.lat,
f.lng
]
).addTo(map);

marker.on(
"click",
function(){

document.getElementById("panel").innerHTML =

"<h2>"

+

f.name

+

"</h2>"

+

"<p><b>"

+

f.city

+

"</b></p>"

+

"<h3>About</h3>"

+

"<p>"

+

f.about

+

"</p>";

}

);

});

</script>

</body>

</html>
