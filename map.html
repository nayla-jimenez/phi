<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>PHI Adopt a Facility</title>

<link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<style>

body{
margin:0;
font-family:'Sniglet', cursive;
}


#container{
display:flex;
height:650px;
}


#map{
width:65%;
height:650px;
}


#panel{
width:35%;
padding:25px;
background:white;
overflow:auto;
box-sizing:border-box;
}


h2,h3{
font-family:'Poppins', sans-serif;
font-weight:800;
color:#006d77;
}


p{
font-family:Arial,sans-serif;
font-size:16px;
line-height:1.5;
}


.need{
font-family:Arial,sans-serif;
margin:8px 0;
}


.sponsor{

display:block;
background:#d62828;
color:white;
padding:15px;
margin-top:25px;
border-radius:12px;
text-align:center;
text-decoration:none;
font-size:18px;
font-weight:bold;

}


.sponsor:hover{
background:#a51d1d;
}


.progress-container{

background:#ddd;
height:25px;
border-radius:15px;
overflow:hidden;

}


.progress-bar{

background:#006d77;
height:25px;
color:white;
text-align:center;
line-height:25px;
font-family:Arial,sans-serif;
font-size:14px;

}



@media(max-width:800px){

#container{
flex-direction:column;
height:auto;
}

#map{
width:100%;
height:400px;
}

#panel{
width:100%;
}

}

</style>

</head>


<body>


<div id="container">

<div id="map"></div>


<div id="panel">

<h2>Adopt a Facility</h2>

<p>
Click a marker on the Philippines map to learn about a partner institution and sponsor their next Balikbayan Box.
</p>

</div>

</div>



<script>


// ===================================
// WEBADOR SPONSOR PAGE
// ===================================

var sponsorPage =
"https://www.philippinehealthinitiative.org/get-involved/balikbayan-sponsor";




// ===================================
// FACILITY DATABASE
// ===================================


var facilities=[


{

name:"Eversley Childs Sanitarium and General Hospital",

city:"Cebu City, Cebu",

lat:10.3157,

lng:123.8854,

about:
"Eversley Childs Sanitarium serves pediatric patients and families in Cebu. PHI partners with facilities like this to provide essential medical supplies and child-centered resources.",

needs:[

"Medical gloves",

"Gauze and bandages",

"Syringes",

"Pediatric hygiene kits",

"Small toys"

],

progress:60

},



{

name:"Project Eskwela Partner School",

city:"Cebu City, Cebu",

lat:10.3000,

lng:123.8800,

about:
"A public school community where students experience shortages in classroom supplies. PHI provides educational resources to support student learning.",

needs:[

"Notebooks",

"Pencils",

"Crayons",

"Markers",

"Backpacks"

],

progress:40

},



{

name:"Southern Philippines Medical Center",

city:"Davao City, Philippines",

lat:7.1907,

lng:125.4553,

about:
"A regional medical center serving families throughout Mindanao.",

needs:[

"Medical supplies",

"Hygiene kits",

"Patient comfort items"

],

progress:25

}


];




// ===================================
// CREATE MAP
// ===================================


var map=L.map("map")
.setView(
[12.8797,121.7740],
6
);



L.tileLayer(

"https://tile.openstreetmap.org/{z}/{x}/{y}.png",

{
attribution:"© OpenStreetMap contributors"
}

).addTo(map);





// ===================================
// CREATE MARKERS
// ===================================


facilities.forEach(function(f){


var marker=L.marker(
[
f.lat,
f.lng
]
).addTo(map);



marker.on(
"click",
function(){



var supplies="";


for(var i=0;i<f.needs.length;i++){


supplies +=

"<div class='need'>☐ "

+

f.needs[i]

+

"</div>";

}





document.getElementById("panel").innerHTML =


"<h2>"

+

f.name

+

"</h2>"



+

"<p><b>"

+

f.city

+

"</b></p>"



+

"<h3>About</h3>"



+

"<p>"

+

f.about

+

"</p>"



+

"<h3>Needed Supplies</h3>"



+

supplies



+

"<h3>Balikbayan Box Progress</h3>"



+

"<div class='progress-container'>"



+

"<div class='progress-bar' style='width:"

+

f.progress

+

"%'>"

+

f.progress

+

"%"

+

"</div>"



+

"</div>"



+

"<a class='sponsor' target='_blank' href='"

+

sponsorPage

+

"?facility="

+

encodeURIComponent(f.name)

+

"'>"

+

"❤️ Sponsor This Facility"

+

"</a>";



}

);


});



</script>


</body>

</html>
