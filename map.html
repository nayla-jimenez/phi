<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>PHI Adopt a Facility</title>


<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<style>

body{
margin:0;
font-family:Arial,sans-serif;
}


#container{
display:flex;
height:650px;
}


#map{
width:65%;
height:650px;
}


#panel{

width:35%;
padding:25px;
background:white;
overflow:auto;

}


h2{
color:#006d77;
}


.sponsor{

display:block;
background:#d62828;
color:white;
padding:15px;
margin-top:25px;
border-radius:8px;
text-align:center;
text-decoration:none;
font-weight:bold;

}


.sponsor:hover{

background:#a51d1d;

}


.need{

margin:8px 0;

}


@media(max-width:800px){

#container{

flex-direction:column;

}

#map{

width:100%;
height:400px;

}

#panel{

width:100%;

}

}


</style>


</head>


<body>


<div id="container">


<div id="map"></div>


<div id="panel">

<h2>Adopt a Facility</h2>

<p>
Click a marker on the Philippines map to learn about a facility and sponsor a Balikbayan Box.
</p>

</div>


</div>



<script>


// CHANGE THIS TO YOUR WEBADOR PAGE LINK
var sponsorPage =
"https://YOUR-WEBADOR-LINK.com/balikbayan-sponsor";



var facilities=[


{

name:"Eversley Childs Sanitarium and General Hospital",

city:"Cebu City, Cebu",

lat:10.3157,

lng:123.8854,


about:
"Eversley Childs Sanitarium serves pediatric patients and families in Cebu. PHI partners with facilities like this to provide essential medical supplies and child-centered resources.",


needs:[

"Medical gloves",

"Gauze and bandages",

"Syringes",

"Pediatric hygiene kits",

"Small toys"

],


progress:60


},



{

name:"Project Eskwela Partner School",

city:"Cebu City, Cebu",

lat:10.3000,

lng:123.8800,


about:
"A public school community where students experience shortages in classroom supplies. PHI provides educational resources to support student learning.",


needs:[

"Notebooks",

"Pencils",

"Crayons",

"Markers",

"Backpacks"

],


progress:40


},



{

name:"Southern Philippines Medical Center",

city:"Davao City, Philippines",

lat:7.1907,

lng:125.4553,


about:
"A regional medical center serving families throughout Mindanao.",


needs:[

"Medical supplies",

"Hygiene kits",

"Patient comfort items"

],


progress:25


}



];





var map=L.map("map")
.setView([12.8797,121.7740],6);



L.tileLayer(

"https://tile.openstreetmap.org/{z}/{x}/{y}.png",

{

attribution:"© OpenStreetMap contributors"

}

).addTo(map);





facilities.forEach(function(f){



var marker=L.marker(

[f.lat,f.lng]

)

.addTo(map);





marker.on(

"click",

function(){



var supplies="";



for(var i=0;i<f.needs.length;i++){


supplies +=

"<div class='need'>☐ "
+
f.needs[i]
+
"</div>";



}




// AUTOMATICALLY SEND FACILITY NAME

var sponsorLink =

sponsorPage

+

"?facility="

+

encodeURIComponent(f.name);






document.getElementById("panel").innerHTML =


"<h2>"
+
f.name
+
"</h2>"



+

"<b>"
+
f.city
+
"</b>"



+

"<h3>About</h3>"

+

"<p>"
+
f.about
+
"</p>"



+

"<h3>Needed Supplies</h3>"

+

supplies



+

"<h3>Balikbayan Box Progress</h3>"



+

"<div style='background:#ddd;height:20px;border-radius:10px;'>"

+

"<div style='background:#006d77;width:"
+
f.progress
+
"%;height:20px;color:white;text-align:center;border-radius:10px;'>"

+

f.progress
+
"%"

+

"</div></div>"



+

"<a class='sponsor' target='_blank' href='"

+

sponsorLink

+

"'>"

+

"❤️ Sponsor This Facility"

+

"</a>";





}

);



});



</script>


</body>

</html>
