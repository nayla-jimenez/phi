<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>PHI Facility Map</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

body{
margin:0;
font-family:'Poppins', sans-serif;
}

#container{
display:flex;
height:650px;
}

#map{
width:75%;
height:650px;
}

#panel{
width:25%;
padding:25px;
background:white;
overflow:auto;
box-sizing:border-box;
}

h2,h3{
font-family:'Poppins', sans-serif;
font-weight:800;
color:#006d77;
}

p{
font-family:'Poppins', sans-serif;
font-size:16px;
line-height:1.5;
}

@media(max-width:800px){

#container{
flex-direction:column;
height:auto;
}

#map{
width:100%;
height:400px;
}

#panel{
width:100%;
}

}

</style>

</head>

<body>

<div id="container">

<div id="map"></div>

<div id="panel">

<h2>Adopt a Facility</h2>

<p>
Explore PHI's partner hospitals, schools, and community organizations across the Philippines. Click a marker to learn more about each facility and the communities they serve.
</p>

</div>

</div>

<script>

// ===================================
// FACILITY DATABASE
// ===================================

var facilities=[

{

name:"Eversley Childs Sanitarium and General Hospital",

city:"Cebu City, Cebu",

lat:10.3157,

lng:123.8854,

about:
"Eversley Childs Sanitarium serves pediatric patients and families in Cebu. PHI partners with facilities like this to provide essential medical supplies and child-centered resources."

},

{

name:"Project Eskwela Partner School",

city:"Cebu City, Cebu",

lat:10.3000,

lng:123.8800,

about:
"A public school community where students experience shortages in classroom supplies. PHI provides educational resources to support student learning."

},

{

name:"Southern Philippines Medical Center",

city:"Davao City, Philippines",

lat:7.1907,

lng:125.4553,

about:
"A regional medical center serving families throughout Mindanao."

}

];


// ===================================
// CREATE MAP
// ===================================

var map=L.map("map")
.setView(
[12.8797,121.7740],
6
);

L.tileLayer(

"https://tile.openstreetmap.org/{z}/{x}/{y}.png",

{
attribution:"© OpenStreetMap contributors"
}

).addTo(map);


// ===================================
// CREATE MARKERS
// ===================================

facilities.forEach(function(f){

var marker=L.marker(
[
f.lat,
f.lng
]
).addTo(map);

marker.on(
"click",
function(){

document.getElementById("panel").innerHTML =

"<h2>"

+

f.name

+

"</h2>"

+

"<p><b>"

+

f.city

+

"</b></p>"

+

"<h3>About</h3>"

+

"<p>"

+

f.about

+

"</p>";

}

);

});

</script>

</body>

</html>
